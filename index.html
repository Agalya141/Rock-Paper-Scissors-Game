<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p class="title">Rock Paper Scissors</p>
    <div class="buttons">
        <button id="rock" onclick="playGame('Rock')" class="move-button">
            <img src="images/rock-emoji.png" class="move-icon">
        </button>
        <button id="paper" onclick="playGame('Paper')" class="move-button">
            <img src="images/paper-emoji.png" class="move-icon">
        </button>
        <button id="scissors" onclick="playGame('Scissors')" class="move-button">
            <img src="images/scissors-emoji.png" class="move-icon">
        </button>
    </div>
    <p class="js-result"></p>
    <p class="js-moves">

    </p>
    <p class="js-score" class="score"></p>
    <button class="reset-button" onclick="resetScore()">Reset Button</button>
    <p class="streak"></p>
    <script src="script.js">
    </script>
</body>

</html>
